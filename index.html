<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS Animation Scenes</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        html,
        body {
            touch-action: none;
            -webkit-user-select: pan-y;
            -webkit-touch-callout: pan-y;
        }

        .app {
            position: absolute;
            left: 50%;
            top: 50%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            cursor: default !important;
        }

        body,
        canvas,
        html {
            user-select: none;
        }
    </style>
  <script type="module" crossorigin src="./assets/main-D62ndqao.js"></script>
</head>

<body>
    <div id="app"></div>
</body>

</html>
